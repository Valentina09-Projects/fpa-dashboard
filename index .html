<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FP&A Task Dashboard — May 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --color-bg: #f7f6f3;
    --color-surface: #ffffff;
    --color-border: rgba(0,0,0,0.10);
    --color-border-strong: rgba(0,0,0,0.18);
    --color-text-primary: #1a1a18;
    --color-text-secondary: #5a5a56;
    --color-text-muted: #9a9a94;
    --color-accent: #185FA5;
    --color-accent-light: #E6F1FB;
    --color-success: #0F6E56;
    --color-success-light: #E1F5EE;
    --color-warning: #BA7517;
    --color-warning-light: #FAEEDA;
    --color-danger: #A32D2D;
    --color-danger-light: #FCEBEB;
    --color-weekend: #f1efe8;
    --color-today: #EEEDFE;
    --color-today-border: #534AB7;
    --font: -apple-system, 'Segoe UI', sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text-primary);
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    background: var(--color-surface);
    border-bottom: 0.5px solid var(--color-border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--color-accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  header h1 {
    font-size: 15px;
    font-weight: 500;
    color: var(--color-text-primary);
  }

  .header-meta {
    font-size: 12px;
    color: var(--color-text-muted);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    font-family: var(--font);
  }

  .btn:hover { background: var(--color-bg); }

  .btn-primary {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  .btn-primary:hover { background: #0C447C; }

  #file-input { display: none; }

  .upload-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--color-border-strong);
    background: var(--color-surface);
    color: var(--color-text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .upload-label:hover { background: var(--color-bg); }

  .main-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.5rem 2rem 3rem;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--color-surface);
    border: 0.5px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
  }

  .stat-label {
    font-size: 11px;
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 26px;
    font-weight: 500;
    color: var(--color-text-primary);
    line-height: 1;
  }

  .stat-sub {
    font-size: 12px;
    color: var(--color-text-muted);
    margin-top: 4px;
  }

  .stat-value.success { color: var(--color-success); }
  .stat-value.warning { color: var(--color-warning); }
  .stat-value.danger { color: var(--color-danger); }

  .section-banner {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--color-surface);
    border: 0.5px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 14px 20px;
    margin: 1.5rem 0 0.75rem;
  }

  .section-banner-icon {
    font-size: 22px;
    line-height: 1;
  }

  .section-banner-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--color-text-primary);
  }

  .section-banner-sub {
    font-size: 12px;
    color: var(--color-text-muted);
    margin-top: 2px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .calendar-wrapper {
    background: var(--color-surface);
    border: 0.5px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .calendar-month-header {
    padding: 1rem 1.5rem;
    border-bottom: 0.5px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .calendar-month-title {
    font-size: 16px;
    font-weight: 500;
  }

  .calendar-legend {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--color-text-secondary);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .legend-dot.projection { background: var(--color-accent-light); border: 1.5px solid var(--color-accent); }
  .legend-dot.real { background: var(--color-success-light); border: 1.5px solid var(--color-success); }
  .legend-dot.late { background: var(--color-warning-light); border: 1.5px solid var(--color-warning); }
  .legend-dot.weekend { background: var(--color-weekend); border: 1.5px solid var(--color-border-strong); }
  .legend-dot.today { background: var(--color-today); border: 1.5px solid var(--color-today-border); }

  .calendar-grid {
    overflow-x: auto;
  }

  table.cal {
    border-collapse: collapse;
    table-layout: auto;
    width: 100%;
  }

  .cal th {
    padding: 8px 2px;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-muted);
    border-bottom: 0.5px solid var(--color-border);
    background: var(--color-bg);
    min-width: 38px;
    width: 38px;
  }

  .cal th.weekend-header {
    color: var(--color-border-strong);
  }

  .cal th.today-header {
    color: var(--color-today-border);
    font-weight: 600;
  }

  .cal th .day-num {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-top: 2px;
  }

  .cal th.today-header .day-num {
    color: var(--color-today-border);
  }

  .cal th.weekend-header .day-num {
    color: var(--color-border-strong);
  }

  .cal td {
    vertical-align: middle;
    padding: 4px 2px;
    border-right: 0.5px solid var(--color-border);
    border-bottom: 0.5px solid var(--color-border);
    min-width: 38px;
    width: 38px;
    text-align: center;
  }

  .cal td.weekend-col {
    background: var(--color-weekend);
  }

  .cal td.today-col {
    background: var(--color-today);
  }

  .cal td.task-label-col {
    background: var(--color-bg);
    min-width: 340px;
    width: 340px;
    padding: 12px 16px;
    border-right: 1px solid var(--color-border-strong);
    vertical-align: middle;
  }

  .task-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-start;
  }

  .task-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-primary);
    line-height: 1.4;
    white-space: normal;
    word-break: break-word;
  }

  .task-desc {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.4;
    white-space: normal;
    word-break: break-word;
  }

  .task-meta {
    font-size: 11px;
    color: var(--color-text-muted);
    white-space: normal;
  }

  .area-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
    margin-top: 2px;
  }

  .area-accounting { background: #E6F1FB; color: #185FA5; }
  .area-finance { background: #E1F5EE; color: #0F6E56; }
  .area-commercial { background: #EEEDFE; color: #534AB7; }
  .area-projects { background: #FAEEDA; color: #BA7517; }
  .area-fpa { background: #FAECE7; color: #993C1D; }

  .cell-event {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 36px;
  }

  .event-dot {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
  }

  .event-dot.projection {
    background: var(--color-accent-light);
    color: var(--color-accent);
    border: 1.5px solid var(--color-accent);
  }

  .event-dot.real {
    background: var(--color-success-light);
    color: var(--color-success);
    border: 1.5px solid var(--color-success);
  }

  .event-dot.late {
    background: var(--color-warning-light);
    color: var(--color-warning);
    border: 1.5px solid var(--color-warning);
  }

  .tasks-table-wrapper {
    background: var(--color-surface);
    border: 0.5px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  table.tasks {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .tasks th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 0.5px solid var(--color-border);
    background: var(--color-bg);
  }

  .tasks td {
    padding: 11px 14px;
    border-bottom: 0.5px solid var(--color-border);
    vertical-align: middle;
  }

  .tasks tr:last-child td { border-bottom: none; }

  .tasks tr:hover td { background: var(--color-bg); }

  .diff-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }

  .diff-on { background: var(--color-success-light); color: var(--color-success); }
  .diff-late { background: var(--color-warning-light); color: var(--color-warning); }
  .diff-early { background: var(--color-accent-light); color: var(--color-accent); }
  .diff-pending { background: #E1F5EE; color: #0F6E56; }
  .diff-due-today { background: var(--color-today); color: var(--color-today-border); font-weight: 600; }
  .diff-overdue { background: var(--color-danger-light); color: var(--color-danger); font-weight: 600; }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--color-text-muted);
  }

  .empty-state svg {
    display: block;
    margin: 0 auto 1rem;
    opacity: 0.3;
  }

  .empty-state h2 {
    font-size: 16px;
    font-weight: 500;
    color: var(--color-text-secondary);
    margin-bottom: 0.5rem;
  }

  .empty-state p {
    font-size: 13px;
    margin-bottom: 1.5rem;
  }

  .upload-zone {
    border: 1.5px dashed var(--color-border-strong);
    border-radius: var(--radius-lg);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
    background: var(--color-surface);
    margin-top: 1rem;
  }

  .upload-zone:hover { background: var(--color-accent-light); border-color: var(--color-accent); }

  .upload-zone.dragging { background: var(--color-accent-light); border-color: var(--color-accent); }

  .upload-icon {
    font-size: 40px;
    margin-bottom: 0.75rem;
    color: var(--color-accent);
  }

  .upload-zone h3 {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--color-text-primary);
  }

  .upload-zone p {
    font-size: 12px;
    color: var(--color-text-muted);
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--color-text-primary);
    color: white;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  .filter-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 4px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--color-border-strong);
    background: var(--color-surface);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--color-text-secondary);
  }

  .filter-chip.active {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  @media (max-width: 700px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .main-content { padding: 1rem; }
    header { padding: 0 1rem; }
    .calendar-legend { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">FP</div>
    <div>
      <h1>FP&amp;A Task Dashboard</h1>
      <div class="header-meta" id="header-meta">No data loaded</div>
    </div>
  </div>
  <div class="header-right">
    <label class="upload-label" for="file-input">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      Upload Excel
    </label>
    <input type="file" id="file-input" accept=".xlsx,.xls" />
  </div>
</header>

<div class="main-content" id="main-content">
  <div class="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M9 21V9"/>
    </svg>
    <h2>FP&amp;A Task Calendar</h2>
    <p>Upload your Excel file to visualize tasks on the monthly calendar</p>

    <label class="upload-zone" for="file-input" id="upload-zone">
      <div class="upload-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
      </div>
      <h3>Drop your Excel file here</h3>
      <p>or click to browse &nbsp;·&nbsp; Supports .xlsx and .xls</p>
    </label>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const USA_HOLIDAYS_2026 = [
  '2026-01-01','2026-01-19','2026-02-16','2026-05-25',
  '2026-07-03','2026-09-07','2026-10-12','2026-11-11',
  '2026-11-26','2026-12-25'
];

function isUSAWorkday(date) {
  const d = new Date(date);
  const day = d.getDay();
  if (day === 0 || day === 6) return false;
  const iso = d.toISOString().slice(0,10);
  if (USA_HOLIDAYS_2026.includes(iso)) return false;
  return true;
}

function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function toISO(d) {
  if (!d) return null;
  const dt = new Date(d);
  if (isNaN(dt)) return null;
  return dt.toISOString().slice(0,10);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

const AREA_CLASSES = {
  'accounting': 'area-accounting',
  'finance': 'area-finance',
  'commercial': 'area-commercial',
  'projects': 'area-projects',
  "fp&a": 'area-fpa',
  'fpa': 'area-fpa',
};

function getAreaClass(area) {
  return AREA_CLASSES[(area||'').toLowerCase()] || 'area-accounting';
}

let globalTasks = [];
let activeFilter = 'all';

function parseExcel(buffer) {
  const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
  const allTasks = [];

  wb.SheetNames.forEach(sheetName => {
    const ws = wb.Sheets[sheetName];
    if (!ws['!ref']) return;

    const range = XLSX.utils.decode_range(ws['!ref']);

    // Helper: get cell value from worksheet directly
    function cellVal(r, c) {
      const addr = XLSX.utils.encode_cell({ r, c });
      const cell = ws[addr];
      if (!cell) return null;
      if (cell.t === 'd') return cell.v; // JS Date
      if (cell.t === 'n') return cell.v; // number
      if (cell.t === 's') return cell.v === '' ? null : cell.v; // string
      return null;
    }

    function cellStr(r, c) {
      const v = cellVal(r, c);
      return v !== null && v !== undefined ? String(v).trim() : '';
    }

    // Convert a value to ISO date string — only if it's a real Date object
    function toISO(val) {
      if (!val) return null;
      if (val instanceof Date) {
        if (isNaN(val.getTime())) return null;
        // Normalize to local date to avoid UTC offset issues
        const y = val.getUTCFullYear();
        const m = String(val.getUTCMonth() + 1).padStart(2, '0');
        const d = String(val.getUTCDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      return null; // reject numbers, strings — only accept real Date objects
    }

    // Find header row by scanning for 'AREA'
    let headerRow = -1;
    let colArea=-1, colResp=-1, colTask=-1, colEmail=-1, colProj=-1, colReal=-1;

    for (let r = range.s.r; r <= range.e.r; r++) {
      for (let c = range.s.c; c <= range.e.c; c++) {
        const v = cellStr(r, c).toUpperCase();
        if (v === 'AREA') {
          headerRow = r;
          colArea = c;
          break;
        }
      }
      if (headerRow !== -1) break;
    }

    if (headerRow === -1) return;

    // Find other columns by scanning the header row
    for (let c = range.s.c; c <= range.e.c; c++) {
      const v = cellStr(headerRow, c).toUpperCase();
      if (v === 'RESPONSIBLE') colResp = c;
      else if (v === 'TASK') colTask = c;
      else if (v === 'EMAIL') colEmail = c;
      else if (v.includes('PROJECTION DATE')) colProj = c;
      else if (v.includes('REAL DATE')) colReal = c;
    }

    if (colTask === -1 || colProj === -1) return;

    // Parse each data row, tracking section headers like "Resources Confirmations" / "Owner Activities"
    const SECTION_KEYWORDS = ['resources confirmations', 'owner activities'];
    let currentSection = 'General';

    for (let r = headerRow + 1; r <= range.e.r; r++) {
      // Check col A for a section header (spans all columns, has no AREA value in other cols)
      const colAVal = cellStr(r, range.s.c).toLowerCase();
      if (colAVal && SECTION_KEYWORDS.some(k => colAVal.includes(k.split(' ')[0]))) {
        // Capitalize nicely
        currentSection = cellStr(r, range.s.c);
        continue;
      }

      const area = cellStr(r, colArea);
      const task = cellStr(r, colTask);
      if (!area || !task) continue;

      const projRaw = colProj !== -1 ? cellVal(r, colProj) : null;
      const realRaw = colReal !== -1 ? cellVal(r, colReal) : null;

      const projISO = toISO(projRaw);
      const realISO = toISO(realRaw);

      let diff = null;
      if (projISO && realISO) {
        const projMs = new Date(projISO).setHours(0, 0, 0, 0);
        const realMs = new Date(realISO).setHours(0, 0, 0, 0);
        diff = Math.round((projMs - realMs) / 86400000);
      }

      allTasks.push({
        month: sheetName,
        section: currentSection,
        area,
        responsible: cellStr(r, colResp),
        task,
        email: colEmail !== -1 ? cellStr(r, colEmail) : '',
        projectionDate: projISO,
        realDate: realISO,
        diff,
      });
    }
  });

  return allTasks;
}

function getDaysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function renderDashboard(tasks) {
  globalTasks = tasks;
  const today = new Date();
  const todayISO = today.toISOString().slice(0,10);

  const months = [...new Set(tasks.map(t => t.month))];
  const areas = [...new Set(tasks.map(t => t.area))];

  const total = tasks.length;
  const onTime = tasks.filter(t => t.diff !== null && t.diff >= 0).length;
  const late = tasks.filter(t => t.diff !== null && t.diff < 0).length;
  const completed = tasks.filter(t => t.realDate !== null).length;

  const filterArea = activeFilter === 'all' ? null : activeFilter;
  const filteredTasks = filterArea ? tasks.filter(t => t.area === filterArea) : tasks;

  let html = '';

  html += `<div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Tasks</div>
      <div class="stat-value">${total}</div>
      <div class="stat-sub">${months.join(', ')}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Completed</div>
      <div class="stat-value success">${completed}</div>
      <div class="stat-sub">with real date</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">On Time</div>
      <div class="stat-value ${onTime>0?'success':'warning'}">${onTime}</div>
      <div class="stat-sub">diff ≥ 0 days</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Late</div>
      <div class="stat-value ${late>0?'danger':'success'}">${late}</div>
      <div class="stat-sub">after projection date</div>
    </div>
  </div>`;

  html += `<div class="filter-bar">
    <span style="font-size:12px;color:var(--color-text-muted);margin-right:4px">Filter:</span>
    <span class="filter-chip ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">All areas</span>`;

  areas.forEach(a => {
    html += `<span class="filter-chip ${activeFilter===a?'active':''}" onclick="setFilter('${a}')">${a}</span>`;
  });

  html += `</div>`;

  months.forEach(monthName => {
    const monthTasks = filteredTasks.filter(t => t.month === monthName);
    if (monthTasks.length === 0) return;

    const monthMatch = monthName.match(/(\w+)/);
    const monthNames = { JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12 };
    const monthNum = monthNames[(monthMatch?.[1]||'').toUpperCase()] || 5;
    const year = 2026;
    const daysInMonth = getDaysInMonth(year, monthNum);

    const allDates = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(year, monthNum-1, d);
      const iso = dt.toISOString().slice(0,10);
      if (isUSAWorkday(iso)) allDates.push({ day: d, iso, dayOfWeek: dt.getDay() });
    }

    // Get unique sections in order they appear
    const sections = [...new Set(monthTasks.map(t => t.section || 'General'))];

    // Section icons
    const SECTION_ICONS = {
      'resources confirmations': '🔗',
      'owner activities': '⭐',
    };
    function sectionIcon(s) {
      const key = (s||'').toLowerCase();
      for (const k in SECTION_ICONS) { if (key.includes(k.split(' ')[0])) return SECTION_ICONS[k]; }
      return '📋';
    }

    sections.forEach(section => {
      const sectionTasks = monthTasks.filter(t => (t.section||'General') === section);
      if (sectionTasks.length === 0) return;

      // Section banner
      html += `<div class="section-banner">
        <span class="section-banner-icon">${sectionIcon(section)}</span>
        <div>
          <div class="section-banner-title">${section}</div>
          <div class="section-banner-sub">${monthName} 2026 · ${sectionTasks.length} task${sectionTasks.length!==1?'s':''}</div>
        </div>
        <div class="calendar-legend" style="margin-left:auto">
          <div class="legend-item"><div class="legend-dot projection"></div>Projection</div>
          <div class="legend-item"><div class="legend-dot real"></div>Completed</div>
          <div class="legend-item"><div class="legend-dot late"></div>Late</div>
          <div class="legend-item"><div class="legend-dot today"></div>Today</div>
        </div>
      </div>`;

      // Calendar
      html += `<div class="calendar-wrapper">
        <div class="calendar-grid">
        <table class="cal">
          <thead><tr>
            <th style="text-align:left;padding-left:12px;min-width:340px;width:340px">Task</th>`;

      allDates.forEach(({ day, iso, dayOfWeek }) => {
        const isToday = iso === todayISO;
        const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const cls = isToday ? 'today-header' : '';
        html += `<th class="${cls}"><span>${dayNames[dayOfWeek]}</span><span class="day-num">${day}</span></th>`;
      });

      html += `</tr></thead><tbody>`;

      sectionTasks.forEach(task => {
        const descHtml = task.email ? `<span class="task-desc">${task.email}</span>` : '';
        html += `<tr>
          <td class="task-label-col">
            <div class="task-info">
              <span class="area-badge ${getAreaClass(task.area)}">${task.area}</span>
              <span class="task-name">${task.task}</span>
              ${descHtml}
              <span class="task-meta">${task.responsible}</span>
            </div>
          </td>`;

        allDates.forEach(({ iso }) => {
          const isToday = iso === todayISO;
          const colCls = isToday ? 'today-col' : '';
          let inner = '';
          const isProj = task.projectionDate === iso;
          const isReal = task.realDate === iso;
          const isLate = task.realDate && task.projectionDate && task.diff !== null && task.diff < 0 && task.realDate === iso;

          if (isLate) {
            inner = `<div class="cell-event"><div class="event-dot late" title="Late: ${Math.abs(task.diff)} days">R</div></div>`;
          } else if (isReal) {
            inner = `<div class="cell-event"><div class="event-dot real" title="Completed">R</div></div>`;
          } else if (isProj) {
            inner = `<div class="cell-event"><div class="event-dot projection" title="Projection date">P</div></div>`;
          }
          html += `<td class="${colCls}">${inner}</td>`;
        });

        html += `</tr>`;
      });

      html += `</tbody></table></div></div>`;

      // Detail table
      html += `<div class="tasks-table-wrapper" style="margin-bottom:2rem">
        <table class="tasks">
          <thead>
            <tr>
              <th>Area</th>
              <th>Responsible</th>
              <th>Task</th>
              <th>Description</th>
              <th>Projection Date</th>
              <th>Real Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>`;

      sectionTasks.forEach(task => {
        let diffHtml = '';
        if (task.diff === null) {
          if (task.projectionDate) {
            const projMs = new Date(task.projectionDate).setHours(0,0,0,0);
            const todayMs = new Date(todayISO).setHours(0,0,0,0);
            const calDays = Math.round((projMs - todayMs) / 86400000);
            if (calDays > 0) {
              diffHtml = `<span class="diff-chip diff-pending">⏳ ${calDays}d to go</span>`;
            } else if (calDays === 0) {
              diffHtml = `<span class="diff-chip diff-due-today">Due today</span>`;
            } else {
              diffHtml = `<span class="diff-chip diff-overdue">⚠ ${Math.abs(calDays)}d overdue</span>`;
            }
          } else {
            diffHtml = `<span class="diff-chip" style="background:var(--color-bg);color:var(--color-text-muted)">No date</span>`;
          }
        } else if (task.diff === 0) {
          diffHtml = `<span class="diff-chip diff-on">✓ On time</span>`;
        } else if (task.diff > 0) {
          diffHtml = `<span class="diff-chip diff-early">+${task.diff}d early</span>`;
        } else {
          diffHtml = `<span class="diff-chip diff-late">${Math.abs(task.diff)}d late</span>`;
        }

        html += `<tr>
          <td><span class="area-badge ${getAreaClass(task.area)}">${task.area}</span></td>
          <td style="font-weight:500">${task.responsible}</td>
          <td>${task.task}</td>
          <td style="color:var(--color-text-secondary)">${task.email||'—'}</td>
          <td>${formatDate(task.projectionDate)}</td>
          <td>${formatDate(task.realDate)}</td>
          <td>${diffHtml}</td>
        </tr>`;
      });

      html += `</tbody></table></div>`;
    });
  });

  document.getElementById('main-content').innerHTML = html;
}

function setFilter(area) {
  activeFilter = area;
  renderDashboard(globalTasks);
}

function saveToStorage(tasks, filename) {
  try {
    localStorage.setItem('fpa_tasks', JSON.stringify(tasks));
    localStorage.setItem('fpa_filename', filename || '');
  } catch(e) {
    console.warn('Could not save to localStorage:', e);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem('fpa_tasks');
    const filename = localStorage.getItem('fpa_filename') || '';
    if (raw) return { tasks: JSON.parse(raw), filename };
  } catch(e) {}
  return null;
}

function clearStorage() {
  localStorage.removeItem('fpa_tasks');
  localStorage.removeItem('fpa_filename');
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const tasks = parseExcel(new Uint8Array(e.target.result));
      if (tasks.length === 0) {
        showToast('No tasks found. Check the Excel structure.');
        return;
      }
      activeFilter = 'all';
      saveToStorage(tasks, file.name);
      renderDashboard(tasks);
      document.getElementById('header-meta').textContent =
        `${tasks.length} tasks · ${file.name} · saved ✓`;
      showToast(`✓ ${tasks.length} tasks loaded and saved`);
    } catch(err) {
      showToast('Error reading file: ' + err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('file-input').addEventListener('change', e => {
  loadFile(e.target.files[0]);
});

const zone = document.getElementById('upload-zone');
if (zone) {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragging'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragging'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragging');
    loadFile(e.dataTransfer.files[0]);
  });
}

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  loadFile(e.dataTransfer.files[0]);
});

// On load: restore from localStorage, or show demo data
(function init() {
  const saved = loadFromStorage();
  if (saved && saved.tasks && saved.tasks.length > 0) {
    globalTasks = saved.tasks;
    renderDashboard(saved.tasks);

      `${saved.tasks.length} tasks · ${saved.filename} · restored ✓`;

      { month:'MAY', section:'Owner Activities', area:'FP&A', responsible:'Zeyda Navarro', task:'Monthly Report', email:'', projectionDate:'2026-05-27', realDate:null, diff:null },
      { month:'MAY', section:'Owner Activities', area:'FP&A', responsible:'Zeyda Navarro', task:'Financial Statements for Alma', email:'', projectionDate:'2026-05-22', realDate:null, diff:null },
